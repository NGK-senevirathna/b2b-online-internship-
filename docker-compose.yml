services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: b2b_auth
      POSTGRES_USER: b2b_auth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-b2b_auth_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b2b_auth -d b2b_auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    init: true
    command: ["sh", "-c", "npm run db:migrate && npm start"]
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://b2b_auth:${POSTGRES_PASSWORD:-b2b_auth_dev_password}@host.docker.internal:5432/b2b_auth
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env}
      ROLE_PROVISIONING_KEY: ${ROLE_PROVISIONING_KEY:?Set ROLE_PROVISIONING_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HOST_PORT:-5000}:5000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
